name: Publish Threads Post

# Mirrors publish-carousel.yml but for text posts on Threads (graph.threads.net).
# Drains every DUE "pending" entry from threads-schedule.json, up to MAX_PER_RUN.
#
# TRIGGER: primary is cron-job.org → workflow_dispatch at the slot times
# (09:00/12:00/15:00/18:00 МСК), same PAT as the carousel trigger. The schedule
# below is a once-daily backstop (21:00 МСК) that drains any post a missed
# cron-job.org trigger left behind. The publish script never publishes before a
# slot, so a delayed run is only ever late, never early.
#
# 🔥 02.09.2026. С 25.08 задания cron-job.org получали от GitHub 401 (протух
# отдельный PAT, которым авторизованы задания на этот репозиторий), и работал
# только суточный backstop. Он забирал ОДИН пост за прогон, поэтому дорожка шла
# по одному посту в день вместо четырёх и накопила 25 просроченных записей.
# Разгребать пришлось руками, сдвигая всё расписание. Отсюда MAX_PER_RUN: в
# обычный день созревший пост ровно один и поведение прежнее, а после простоя
# дорожка идёт вдвое быстрее и долг расходится сама.

on:
  schedule:
    - cron: '0 18 * * *'   # 21:00 МСК — daily backstop
  workflow_dispatch:

# Serialize runs so two triggers can't publish the same post twice or push a
# stale threads-schedule.json.
concurrency:
  group: publish-threads
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Publish text post via Threads API
        env:
          THREADS_ACCESS_TOKEN: ${{ secrets.THREADS_ACCESS_TOKEN }}
          THREADS_USER_ID:      ${{ secrets.THREADS_USER_ID }}
          MAX_PER_RUN:          '2'
        run: |
          python3 << 'EOF'
          import json
          import os
          import sys
          import time
          import requests
          from datetime import datetime, timezone, timedelta

          ACCESS_TOKEN = os.environ["THREADS_ACCESS_TOKEN"]
          USER_ID      = os.environ["THREADS_USER_ID"]
          THREADS_BASE = "https://graph.threads.net/v1.0"

          # Сколько созревших постов забираем за один прогон. Единица означала бы,
          # что четыре прогона в день закрывают ровно четыре новых поста и ни одного
          # просроченного: любой простой пришлось бы разгребать руками.
          MAX_PER_RUN  = int(os.environ.get("MAX_PER_RUN", "2"))
          # После скольких неудачных прогонов запись снимается с публикации, чтобы
          # не быть пробкой для всех следующих слотов.
          MAX_ATTEMPTS = 3
          # Пауза между постами внутри одного прогона: два поста в одну минуту
          # выглядят как бот и в ленте, и для самой площадки.
          GAP_SEC      = 75


          class EntryError(Exception):
              """Беда с конкретной записью: считаем попытку, идём к следующей."""


          class GlobalError(Exception):
              """Беда со всем каналом (мёртвый токен, лимит). Дальше идти нельзя.

              Отдельный класс нужен, чтобы мёртвый токен не сжёг счётчики попыток у
              всех созревших записей и не выбросил их содержимое: причина не в них.
              """


          def graph_post(url, params, label, fatal=True):
              # Retry transient failures (5xx, is_transient, network). 5s/15s/45s backoff.
              # fatal=True: поднять исключение (основной пост).
              # fatal=False: вернуть None (ответ-комментарий best-effort, его сбой
              # не должен мешать сохранить уже опубликованный пост).
              delays = [5, 15, 45]
              last_text = ""
              for attempt in range(len(delays) + 1):
                  try:
                      resp = requests.post(url, params=params, timeout=60)
                      print(f"  {label} attempt {attempt + 1}: {resp.status_code} {resp.text[:200]}")
                      if resp.ok:
                          return resp
                      last_text = resp.text
                      code = None
                      try:
                          code = resp.json().get("error", {}).get("code")
                      except ValueError:
                          pass
                      # Мёртвый токен и лимиты площадки — беда не записи, а канала.
                      if fatal and (resp.status_code in (401, 403) or code in (4, 17, 32, 190, 613)):
                          raise GlobalError(f"{label}: {resp.status_code} {resp.text[:200]}")
                      transient = resp.status_code >= 500
                      if not transient:
                          try:
                              transient = bool(resp.json().get("error", {}).get("is_transient"))
                          except ValueError:
                              transient = False
                      if not transient:
                          print(f"  {label}: non-transient error, giving up")
                          if fatal:
                              raise EntryError(f"{label}: {resp.status_code} {resp.text[:200]}")
                          return None
                  except requests.RequestException as e:
                      last_text = str(e)
                      print(f"  {label} attempt {attempt + 1}: network error: {e}")
                  if attempt < len(delays):
                      time.sleep(delays[attempt])
              print(f"  {label}: exhausted retries. Last response: {last_text[:300]}")
              if fatal:
                  raise EntryError(f"{label}: retries exhausted, {last_text[:200]}")
              return None

          moscow_tz = timezone(timedelta(hours=3))
          now_moscow = datetime.now(moscow_tz)
          print(f"Moscow time: {now_moscow.strftime('%Y-%m-%d %H:%M')}")

          with open("threads-schedule.json", "r", encoding="utf-8") as f:
              schedule = json.load(f)

          def scheduled_dt(item):
              return datetime.strptime(
                  f"{item['date']} {item['time']}", "%Y-%m-%d %H:%M"
              ).replace(tzinfo=moscow_tz)

          # Все созревшие pending по возрастанию слота. Мы никогда не публикуем раньше
          # слота, поэтому запоздавший прогон бывает только поздним, но не ранним.
          due = []
          for i, item in enumerate(schedule):
              if item.get("status") != "pending":
                  continue
              if scheduled_dt(item) > now_moscow:
                  continue
              due.append((scheduled_dt(item), i))
          due.sort(key=lambda p: p[0])

          if not due:
              print("No due pending thread. Skipping.")
              sys.exit(0)

          print(f"Созревших записей: {len(due)}, беру не больше {MAX_PER_RUN}")
          problems = []
          published = 0


          def publish_one(entry_idx, slot_dt):
              """Публикует одну запись. Меняет schedule на месте, файл не пишет."""
              global published
              entry = schedule[entry_idx]
              late_min = int((now_moscow - slot_dt).total_seconds() // 60)
              print(f"Publishing thread {entry['id']} "
                    f"(slot {entry['date']} {entry['time']}, {late_min} min late)")

              text = entry["text"]
              if len(text) > 500:
                  # Раньше здесь был sys.exit(1) ДО записи файла: статус записи не
                  # менялся, шаг коммита не выполнялся, и следующий запуск брал тот же
                  # пост снова. Один длинный текст останавливал очередь Threads навсегда.
                  # Теперь запись снимается с публикации, очередь идёт дальше, а job
                  # всё равно падает в конце, чтобы пришло уведомление.
                  print(f"ERROR: text is {len(text)} chars, Threads hard limit is 500.")
                  print(f"Снимаю запись {entry['id']} с публикации (error_too_long), очередь освобождаю.")
                  entry["status"] = "error_too_long"
                  problems.append(f"{entry['id']}: {len(text)} симв. при лимите 500, снят (error_too_long)")
                  return

              # Шаг 1: создаём контейнер. Если у записи есть поле "image" с публичным
              # URL картинки - постим картинкой, текст уходит подписью. Иначе текстом.
              image_url = entry.get("image")
              if image_url:
                  params = {
                      "media_type":   "IMAGE",
                      "image_url":    image_url,
                      "text":         text,
                      "access_token": ACCESS_TOKEN,
                  }
                  print(f"With image: {image_url}")
              else:
                  params = {
                      "media_type":   "TEXT",
                      "text":         text,
                      "access_token": ACCESS_TOKEN,
                  }
              resp = graph_post(
                  f"{THREADS_BASE}/{USER_ID}/threads",
                  params,
                  "Create container",
              )
              creation_id = resp.json()["id"]
              print(f"Container ID: {creation_id}")

              # Meta рекомендует подождать ~30с перед публикацией, чтобы контейнер
              # обработался. Для текста обычно мгновенно, но пауза стоит дёшево.
              time.sleep(30)

              # Шаг 2: публикуем
              resp = graph_post(
                  f"{THREADS_BASE}/{USER_ID}/threads_publish",
                  {
                      "creation_id":  creation_id,
                      "access_token": ACCESS_TOKEN,
                  },
                  "Publish",
              )

              thread_id = resp.json()["id"]
              print(f"Published! Thread ID: {thread_id}")

              entry["status"]       = "published"
              entry["thread_id"]    = thread_id
              entry["published_at"] = now_moscow.isoformat()
              entry.pop("attempts", None)
              entry.pop("last_error", None)
              published += 1

              # Шаг 3 (опционально): постим ссылку отдельным комментарием-ответом.
              # Threads режет охваты у постов со ссылкой в теле, поэтому ссылка
              # вынесена в поле "reply" и публикуется ответом (reply_to_id) к
              # только что созданному посту. Тело поста остаётся "чистым".
              reply_text = entry.get("reply")
              if reply_text and len(reply_text) > 500:
                  print(f"WARN: reply is {len(reply_text)} chars > 500, skipping reply.")
                  entry["reply_status"] = "skipped_too_long"
                  reply_text = None
              if reply_text:
                  # Контейнер ответа (best-effort: сбой не валит job и не блокирует
                  # сохранение уже опубликованного поста — иначе следующий запуск
                  # опубликовал бы тот же пост повторно).
                  resp = graph_post(
                      f"{THREADS_BASE}/{USER_ID}/threads",
                      {
                          "media_type":   "TEXT",
                          "text":         reply_text,
                          "reply_to_id":  thread_id,
                          "access_token": ACCESS_TOKEN,
                      },
                      "Create reply container",
                      fatal=False,
                  )
                  reply_id = None
                  if resp is not None:
                      reply_creation_id = resp.json()["id"]
                      print(f"Reply container ID: {reply_creation_id}")
                      time.sleep(30)
                      resp = graph_post(
                          f"{THREADS_BASE}/{USER_ID}/threads_publish",
                          {
                              "creation_id":  reply_creation_id,
                              "access_token": ACCESS_TOKEN,
                          },
                          "Publish reply",
                          fatal=False,
                      )
                      if resp is not None:
                          reply_id = resp.json()["id"]
                  if reply_id:
                      print(f"Reply published! Reply ID: {reply_id}")
                      entry["reply_id"]     = reply_id
                      entry["reply_status"] = "published"
                  else:
                      print("WARN: reply failed to publish; post stays published, reply marked failed.")
                      entry["reply_status"] = "failed"


          aborted = None
          for slot_dt, entry_idx in due[:MAX_PER_RUN]:
              entry = schedule[entry_idx]
              try:
                  if published:
                      print(f"Пауза {GAP_SEC}с перед следующим постом")
                      time.sleep(GAP_SEC)
                  publish_one(entry_idx, slot_dt)
              except GlobalError as e:
                  # Счётчики попыток не трогаем: записи ни при чём, беда с каналом.
                  aborted = str(e)
                  print(f"ОСТАНОВКА: похоже на беду канала, а не записи — {e}")
                  break
              except EntryError as e:
                  n = int(entry.get("attempts", 0)) + 1
                  entry["attempts"] = n
                  entry["last_error"] = str(e)[:300]
                  if n >= MAX_ATTEMPTS:
                      entry["status"] = "error_publish"
                      problems.append(f"{entry['id']}: {n} неудач подряд, снят (error_publish) — {str(e)[:120]}")
                      print(f"Запись {entry['id']} снята с публикации после {n} попыток, очередь освобождаю.")
                  else:
                      problems.append(f"{entry['id']}: попытка {n} из {MAX_ATTEMPTS} — {str(e)[:120]}")
                      print(f"Запись {entry['id']}: попытка {n} из {MAX_ATTEMPTS}, остаётся в очереди.")

          # Пишем файл один раз на все изменения прогона.
          with open("threads-schedule.json", "w", encoding="utf-8") as f:
              json.dump(schedule, f, ensure_ascii=False, indent=2)
          print(f"threads-schedule.json updated. Опубликовано за прогон: {published}")

          if aborted:
              problems.append(f"канал недоступен: {aborted[:200]}")

          with open(os.environ["GITHUB_ENV"], "a", encoding="utf-8") as f:
              print(f"THREADS_PUBLISHED={published}", file=f)
              if problems:
                  # Одной строкой: многострочное значение в GITHUB_ENV требует
                  # разделителей и ломается о случайный перенос из текста ошибки.
                  print("THREADS_PROBLEMS=" + " | ".join(problems).replace("\n", " ")[:900], file=f)
          EOF

      - name: Commit updated schedule
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add threads-schedule.json
          if [ -n "$THREADS_PROBLEMS" ] && [ "${THREADS_PUBLISHED:-0}" = "0" ]; then
            msg="Threads: проблемные записи, ничего не опубликовано $(date -u +%Y-%m-%d\ %H:%M) UTC"
          else
            msg="Published ${THREADS_PUBLISHED:-0} thread(s) $(date -u +%Y-%m-%d\ %H:%M) UTC"
          fi
          git diff --staged --quiet || git commit -m "$msg"
          # Публикация уже состоялась — статус обязан доехать, иначе следующий запуск
          # отправит тот же пост повторно. Пуш в main может отбить чужой коммит
          # (человек или другой воркфлоу), поэтому перед повтором подтягиваем main
          # ребейзом: наш коммит трогает только своё расписание и конфликтовать
          # ему не с чем.
          for i in 1 2 3; do
            git push && exit 0
            echo "push отбит, подтягиваю main (попытка $i)"
            git pull --rebase origin main || exit 1
          done
          git push

      # Коммит уже проехал и очередь разблокирована, но job обязан упасть — иначе
      # про сорванный пост никто не узнает.
      - name: Fail if an entry was rejected
        if: env.THREADS_PROBLEMS != ''
        run: |
          echo "::error::Threads: ${THREADS_PROBLEMS}"
          exit 1
