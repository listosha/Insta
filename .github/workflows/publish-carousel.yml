name: Publish Instagram Carousel

on:
  schedule:
    # Primary trigger is cron-job.org → workflow_dispatch, firing at the exact
    # slot times (09:30/13:30/19:00 МСК) because GitHub's own cron is delayed
    # 30–120 min. This schedule is now just a once-daily backstop: if a
    # cron-job.org trigger was missed, this run drains the oldest overdue
    # pending post. The publish script never publishes before a slot, so a
    # delayed run is only ever late, never early.
    - cron: '0 17 * * *'   # 20:00 МСК — daily backstop, after the 19:00 slot
  workflow_dispatch:

# Serialize runs so two (possibly delayed) triggers can't publish the same
# post twice or push a stale schedule.json.
concurrency:
  group: publish-carousel
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Publish carousel via Instagram Graph API
        env:
          INSTAGRAM_ACCESS_TOKEN: ${{ secrets.INSTAGRAM_ACCESS_TOKEN }}
        run: |
          python3 << 'EOF'
          import json
          import os
          import sys
          import time
          import requests
          from datetime import datetime, timezone, timedelta

          ACCESS_TOKEN = os.environ["INSTAGRAM_ACCESS_TOKEN"]
          GRAPH_BASE   = "https://graph.facebook.com/v21.0"
          IG_USER_ID   = "17841403939108726"

          def graph_post(url, params, label):
              # Retry transient Graph API failures (5xx, is_transient flag, network errors).
              # Three attempts: 5s, 15s, 45s backoff.
              delays = [5, 15, 45]
              last_text = ""
              for attempt in range(len(delays) + 1):
                  try:
                      resp = requests.post(url, params=params, timeout=60)
                      print(f"  {label} attempt {attempt + 1}: {resp.status_code} {resp.text[:200]}")
                      if resp.ok:
                          return resp
                      last_text = resp.text
                      code = None
                      try:
                          code = resp.json().get("error", {}).get("code")
                      except ValueError:
                          pass
                      # Мёртвый токен и лимиты площадки — беда не записи, а канала.
                      # Уходим жёстко, НЕ трогая счётчик попыток: иначе протухший
                      # токен за три прогона выбросил бы содержимое трёх записей.
                      if resp.status_code in (401, 403) or code in (4, 17, 32, 190, 613):
                          print(f"  {label}: похоже на беду канала ({resp.status_code}/{code}), "
                                f"счётчик попыток не трогаю")
                          sys.exit(1)
                      transient = resp.status_code >= 500
                      if not transient:
                          try:
                              transient = bool(resp.json().get("error", {}).get("is_transient"))
                          except ValueError:
                              transient = False
                      if not transient:
                          print(f"  {label}: non-transient error, giving up")
                          bail(f"{label}: {resp.status_code} {resp.text[:160]}")
                  except requests.RequestException as e:
                      last_text = str(e)
                      print(f"  {label} attempt {attempt + 1}: network error: {e}")
                  if attempt < len(delays):
                      time.sleep(delays[attempt])
              print(f"  {label}: exhausted retries. Last response: {last_text[:300]}")
              bail(f"{label}: попытки исчерпаны, {last_text[:160]}")

          moscow_tz = timezone(timedelta(hours=3))
          now_moscow = datetime.now(moscow_tz)
          print(f"Moscow time: {now_moscow.strftime('%Y-%m-%d %H:%M')}")

          with open("schedule.json", "r", encoding="utf-8") as f:
              schedule = json.load(f)

          def scheduled_dt(item):
              return datetime.strptime(
                  f"{item['date']} {item['time']}", "%Y-%m-%d %H:%M"
              ).replace(tzinfo=moscow_tz)

          # Pick the earliest pending entry whose slot time has already passed,
          # one per run. We never publish before the scheduled time, so a
          # delayed GitHub run can only make a post late, never early. Posts
          # whose cron GitHub skipped are caught on a later run — the queue
          # drains strictly in schedule order.
          entry = None
          entry_idx = None
          best_dt = None
          for i, item in enumerate(schedule):
              if item.get("status") != "pending":
                  continue
              dt = scheduled_dt(item)
              if dt > now_moscow:
                  continue
              if best_dt is None or dt < best_dt:
                  best_dt, entry, entry_idx = dt, item, i

          if entry is None:
              print("No due pending carousel. Skipping.")
              sys.exit(0)

          # После скольких неудачных прогонов запись снимается с публикации.
          MAX_ATTEMPTS = 3


          def bail(reason):
              """Беда с этой записью: считаем попытку и освобождаем очередь.

              Раньше здесь стоял sys.exit(1) ДО записи файла: статус не менялся, шаг
              коммита не выполнялся, и следующий прогон брал ту же запись снова. Одна
              непубликуемая карусель встала бы пробкой перед всеми следующими слотами.
              Теперь прогон выходит с нулём, коммит проезжает, а job валит отдельный
              шаг в конце — чтобы про сорванный пост всё-таки узнали.
              """
              n = int(entry.get("attempts", 0)) + 1
              schedule[entry_idx]["attempts"] = n
              schedule[entry_idx]["last_error"] = str(reason)[:300]
              if n >= MAX_ATTEMPTS:
                  schedule[entry_idx]["status"] = "error_publish"
                  note = f"{entry['id']}: {n} неудач подряд, снят (error_publish) — {reason}"
                  print(f"Запись {entry['id']} снята с публикации после {n} попыток, очередь освобождаю.")
              else:
                  note = f"{entry['id']}: попытка {n} из {MAX_ATTEMPTS} — {reason}"
                  print(f"Запись {entry['id']}: попытка {n} из {MAX_ATTEMPTS}, остаётся в очереди.")
              with open("schedule.json", "w", encoding="utf-8") as f:
                  json.dump(schedule, f, ensure_ascii=False, indent=2)
              with open(os.environ["GITHUB_ENV"], "a", encoding="utf-8") as f:
                  print("CAROUSEL_PROBLEM=" + note.replace("\n", " ")[:900], file=f)
              sys.exit(0)

          late_min = int((now_moscow - best_dt).total_seconds() // 60)
          print(f"Publishing: {entry['id']} — {entry['folder']} "
                f"({entry['slides_count']} slides; slot {entry['date']} {entry['time']}, {late_min} min late)")

          image_urls = [
              f"https://raw.githubusercontent.com/listosha/Insta/main/images/{entry['folder']}/slide-{str(i).zfill(2)}.png"
              for i in range(1, entry["slides_count"] + 1)
          ]
          print(f"URLs: {image_urls}")

          # Одиночная картинка постится обычным постом: карусель в Graph API требует
          # минимум два элемента и на одном падает с "Invalid parameter" (subcode 2207088).
          if len(image_urls) == 1:
              print("Single image: posting as a regular photo, not a carousel")
              resp = graph_post(
                  f"{GRAPH_BASE}/{IG_USER_ID}/media",
                  {
                      "image_url":    image_urls[0],
                      "caption":      entry["caption"],
                      "access_token": ACCESS_TOKEN,
                  },
                  "Single image container",
              )
          else:
              # Шаг 1: создаём item-контейнеры для каждого слайда
              item_ids = []
              for idx, url in enumerate(image_urls, 1):
                  r_item = graph_post(
                      f"{GRAPH_BASE}/{IG_USER_ID}/media",
                      {
                          "image_url":        url,
                          "is_carousel_item": "true",
                          "access_token":     ACCESS_TOKEN,
                      },
                      f"Slide {idx}",
                  )
                  item_ids.append(r_item.json()["id"])

              print(f"Item IDs: {item_ids}")

              # Шаг 2: создаём carousel container
              resp = graph_post(
                  f"{GRAPH_BASE}/{IG_USER_ID}/media",
                  {
                      "media_type":   "CAROUSEL",
                      "caption":      entry["caption"],
                      "children":     ",".join(item_ids),
                      "access_token": ACCESS_TOKEN,
                  },
                  "Carousel container",
              )
          creation_id = resp.json()["id"]
          print(f"Container ID: {creation_id}")

          # Шаг 3: ждём готовности контейнера
          for attempt in range(10):
              time.sleep(3)
              r = requests.get(
                  f"{GRAPH_BASE}/{creation_id}",
                  params={"fields": "status_code", "access_token": ACCESS_TOKEN},
                  timeout=30,
              )
              status = r.json().get("status_code", "")
              print(f"  Container status: {status}")
              if status == "FINISHED":
                  break
              if status == "ERROR":
                  print(f"Container error: {r.text}")
                  bail(f"контейнер не собрался: {r.text[:160]}")

          # Шаг 4: публикуем
          resp = graph_post(
              f"{GRAPH_BASE}/{IG_USER_ID}/media_publish",
              {
                  "creation_id":  creation_id,
                  "access_token": ACCESS_TOKEN,
              },
              "Publish",
          )

          media_id = resp.json()["id"]
          print(f"Published! Media ID: {media_id}")

          schedule[entry_idx]["status"]       = "published"
          schedule[entry_idx]["media_id"]     = media_id
          schedule[entry_idx]["published_at"] = now_moscow.isoformat()
          schedule[entry_idx].pop("attempts", None)
          schedule[entry_idx].pop("last_error", None)

          with open("schedule.json", "w", encoding="utf-8") as f:
              json.dump(schedule, f, ensure_ascii=False, indent=2)

          print("schedule.json updated.")
          EOF

      - name: Commit updated schedule
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add schedule.json
          if [ -n "$CAROUSEL_PROBLEM" ]; then
            msg="Carousel: проблемная запись $(date -u +%Y-%m-%d\ %H:%M) UTC"
          else
            msg="Published carousel $(date -u +%Y-%m-%d\ %H:%M) UTC"
          fi
          git diff --staged --quiet || git commit -m "$msg"
          # Публикация уже состоялась — статус обязан доехать, иначе следующий запуск
          # отправит тот же пост повторно. Пуш в main может отбить чужой коммит
          # (человек или другой воркфлоу), поэтому перед повтором подтягиваем main
          # ребейзом: наш коммит трогает только своё расписание и конфликтовать
          # ему не с чем.
          for i in 1 2 3; do
            git push && exit 0
            echo "push отбит, подтягиваю main (попытка $i)"
            git pull --rebase origin main || exit 1
          done
          git push

      # Коммит со счётчиком попыток уже проехал и очередь разблокирована, но job
      # обязан упасть — иначе про сорванный пост никто не узнает.
      - name: Fail if an entry was rejected
        if: env.CAROUSEL_PROBLEM != ''
        run: |
          echo "::error::Карусели: ${CAROUSEL_PROBLEM}"
          exit 1
