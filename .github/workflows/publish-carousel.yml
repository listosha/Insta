name: Publish Instagram Carousel

on:
  schedule:
    - cron: '0 7 * * *'   # 10:00 МСК
    - cron: '30 7 * * *'  # 10:30 МСК
    - cron: '0 11 * * *'  # 14:00 МСК
    - cron: '30 11 * * *' # 14:30 МСК
    - cron: '30 16 * * *' # 19:30 МСК
    - cron: '0 17 * * *'  # 20:00 МСК
    - cron: '0 13 30 4 *' # 16:00 МСК 30 апреля (разовый)
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Publish carousel via Instagram Graph API
        env:
          INSTAGRAM_ACCESS_TOKEN: ${{ secrets.INSTAGRAM_ACCESS_TOKEN }}
        run: |
          python3 << 'EOF'
          import json
          import os
          import sys
          import time
          import requests
          from datetime import datetime, timezone, timedelta

          ACCESS_TOKEN = os.environ["INSTAGRAM_ACCESS_TOKEN"]
          GRAPH_BASE   = "https://graph.facebook.com/v21.0"
          IG_USER_ID   = "17841403939108726"

          def graph_post(url, params, label):
              # Retry transient Graph API failures (5xx, is_transient flag, network errors).
              # Three attempts: 5s, 15s, 45s backoff.
              delays = [5, 15, 45]
              last_text = ""
              for attempt in range(len(delays) + 1):
                  try:
                      resp = requests.post(url, params=params, timeout=60)
                      print(f"  {label} attempt {attempt + 1}: {resp.status_code} {resp.text[:200]}")
                      if resp.ok:
                          return resp
                      last_text = resp.text
                      transient = resp.status_code >= 500
                      if not transient:
                          try:
                              transient = bool(resp.json().get("error", {}).get("is_transient"))
                          except ValueError:
                              transient = False
                      if not transient:
                          print(f"  {label}: non-transient error, giving up")
                          sys.exit(1)
                  except requests.RequestException as e:
                      last_text = str(e)
                      print(f"  {label} attempt {attempt + 1}: network error: {e}")
                  if attempt < len(delays):
                      time.sleep(delays[attempt])
              print(f"  {label}: exhausted retries. Last response: {last_text[:300]}")
              sys.exit(1)

          moscow_tz = timezone(timedelta(hours=3))
          now_moscow = datetime.now(moscow_tz)
          today = now_moscow.strftime("%Y-%m-%d")
          hour   = now_moscow.hour
          minute = now_moscow.minute

          if hour == 10 and minute <= 25:
              time_slot = "10:00"
          elif hour == 10 and minute > 25:
              time_slot = "10:30"
          elif hour == 14 and minute <= 25:
              time_slot = "14:00"
          elif hour == 14 and minute > 25:
              time_slot = "14:30"
          elif hour == 19:
              time_slot = "19:30"
          elif hour == 20:
              time_slot = "20:00"
          else:
              time_slot = None

          print(f"Moscow time: {now_moscow.strftime('%Y-%m-%d %H:%M')}, slot: {time_slot or 'any'}")

          with open("schedule.json", "r", encoding="utf-8") as f:
              schedule = json.load(f)

          entry = None
          entry_idx = None
          for i, item in enumerate(schedule):
              if item["date"] != today or item["status"] != "pending":
                  continue
              if time_slot is None or item["time"] == time_slot:
                  entry = item
                  entry_idx = i
                  break

          if entry is None:
              print(f"No pending carousel for {today} slot={time_slot or 'any'}. Skipping.")
              sys.exit(0)

          print(f"Publishing: {entry['id']} — {entry['folder']} ({entry['slides_count']} slides)")

          image_urls = [
              f"https://raw.githubusercontent.com/listosha/Insta/main/images/{entry['folder']}/slide-{str(i).zfill(2)}.png"
              for i in range(1, entry["slides_count"] + 1)
          ]
          print(f"URLs: {image_urls}")

          # Шаг 1: создаём item-контейнеры для каждого слайда
          item_ids = []
          for idx, url in enumerate(image_urls, 1):
              resp = graph_post(
                  f"{GRAPH_BASE}/{IG_USER_ID}/media",
                  {
                      "image_url":        url,
                      "is_carousel_item": "true",
                      "access_token":     ACCESS_TOKEN,
                  },
                  f"Slide {idx}",
              )
              item_ids.append(resp.json()["id"])

          print(f"Item IDs: {item_ids}")

          # Шаг 2: создаём carousel container
          resp = graph_post(
              f"{GRAPH_BASE}/{IG_USER_ID}/media",
              {
                  "media_type":   "CAROUSEL",
                  "caption":      entry["caption"],
                  "children":     ",".join(item_ids),
                  "access_token": ACCESS_TOKEN,
              },
              "Carousel container",
          )
          creation_id = resp.json()["id"]
          print(f"Container ID: {creation_id}")

          # Шаг 3: ждём готовности контейнера
          for attempt in range(10):
              time.sleep(3)
              r = requests.get(
                  f"{GRAPH_BASE}/{creation_id}",
                  params={"fields": "status_code", "access_token": ACCESS_TOKEN},
                  timeout=30,
              )
              status = r.json().get("status_code", "")
              print(f"  Container status: {status}")
              if status == "FINISHED":
                  break
              if status == "ERROR":
                  print(f"Container error: {r.text}")
                  sys.exit(1)

          # Шаг 4: публикуем
          resp = graph_post(
              f"{GRAPH_BASE}/{IG_USER_ID}/media_publish",
              {
                  "creation_id":  creation_id,
                  "access_token": ACCESS_TOKEN,
              },
              "Publish",
          )

          media_id = resp.json()["id"]
          print(f"Published! Media ID: {media_id}")

          schedule[entry_idx]["status"]       = "published"
          schedule[entry_idx]["media_id"]     = media_id
          schedule[entry_idx]["published_at"] = now_moscow.isoformat()

          with open("schedule.json", "w", encoding="utf-8") as f:
              json.dump(schedule, f, ensure_ascii=False, indent=2)

          print("schedule.json updated.")
          EOF

      - name: Commit updated schedule
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add schedule.json
          git diff --staged --quiet || git commit -m "Published carousel $(date -u +%Y-%m-%d\ %H:%M) UTC"
          git push
