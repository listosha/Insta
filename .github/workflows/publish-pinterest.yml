name: Publish Pinterest Pin

# DRAFT / черновик — НЕ включать, пока не пройден апгрейд Trial -> Standard и не
# заведены секреты. На Trial-доступе пины видны ТОЛЬКО автору (Sandbox), публика
# их не увидит. См. pinterest-analysis-2026-06-01.md, раздел 1.
#
# Зеркалит publish-threads.yml, но для Pinterest API v5 (POST /v5/pins).
# Дренирует самую раннюю "pending"-запись из pinterest-schedule.json, одну за прогон.
#
# СЕКРЕТЫ (создать в Settings -> Secrets -> Actions перед включением):
#   PINTEREST_ACCESS_TOKEN  — access-токен (живёт 30 дней, рефрешится отдельным воркфлоу)
#
# TRIGGER: по аналогии с Threads — primary через cron-job.org -> workflow_dispatch,
# плюс раз в день cron-бэкстоп. Скрипт никогда не публикует раньше слота, поэтому
# задержанный прогон только опаздывает, но не публикует досрочно.

on:
  # schedule:
  #   - cron: '0 8 * * *'   # включить после апгрейда до Standard и заведения секретов
  workflow_dispatch:

concurrency:
  group: publish-pinterest
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Publish pin via Pinterest API v5
        env:
          PINTEREST_ACCESS_TOKEN: ${{ secrets.PINTEREST_ACCESS_TOKEN }}
        run: |
          pip install --quiet requests
          python3 << 'EOF'
          import json, os, sys, time, requests
          from datetime import datetime, timezone, timedelta

          ACCESS_TOKEN = os.environ["PINTEREST_ACCESS_TOKEN"]
          API_BASE = "https://api.pinterest.com/v5"

          def api_post(path, body, label):
              # Retry transient failures (5xx, network). 5s/15s/45s backoff.
              delays = [5, 15, 45]
              headers = {
                  "Authorization": f"Bearer {ACCESS_TOKEN}",
                  "Content-Type": "application/json",
              }
              last = ""
              for attempt in range(len(delays) + 1):
                  try:
                      r = requests.post(f"{API_BASE}{path}", headers=headers,
                                        data=json.dumps(body), timeout=60)
                      print(f"  {label} attempt {attempt + 1}: {r.status_code} {r.text[:200]}")
                      if r.ok:
                          return r
                      last = r.text
                      if r.status_code < 500:
                          print(f"  {label}: non-transient error, giving up")
                          sys.exit(1)
                  except requests.RequestException as e:
                      last = str(e)
                      print(f"  {label} attempt {attempt + 1}: network error: {e}")
                  if attempt < len(delays):
                      time.sleep(delays[attempt])
              print(f"  {label}: exhausted retries. Last: {last[:300]}")
              sys.exit(1)

          moscow_tz = timezone(timedelta(hours=3))
          now_moscow = datetime.now(moscow_tz)
          print(f"Moscow time: {now_moscow.strftime('%Y-%m-%d %H:%M')}")

          with open("pinterest-schedule.json", "r", encoding="utf-8") as f:
              schedule = json.load(f)

          def scheduled_dt(item):
              return datetime.strptime(
                  f"{item['date']} {item['time']}", "%Y-%m-%d %H:%M"
              ).replace(tzinfo=moscow_tz)

          # Самая ранняя pending, чей слот уже прошёл. Одна за прогон.
          entry = entry_idx = best_dt = None
          for i, item in enumerate(schedule):
              if item.get("status") != "pending":
                  continue
              dt = scheduled_dt(item)
              if dt > now_moscow:
                  continue
              if best_dt is None or dt < best_dt:
                  best_dt, entry, entry_idx = dt, item, i

          if entry is None:
              print("No due pending pin. Skipping.")
              sys.exit(0)

          # Лимиты Pinterest: title <=100, description <=500 символов.
          if len(entry["title"]) > 100:
              print(f"ERROR: title is {len(entry['title'])} chars (>100). Aborting.")
              sys.exit(1)
          if len(entry["description"]) > 500:
              print(f"ERROR: description is {len(entry['description'])} chars (>500). Aborting.")
              sys.exit(1)

          late_min = int((now_moscow - best_dt).total_seconds() // 60)
          print(f"Publishing pin id={entry['id']} (slot {entry['date']} {entry['time']}, {late_min} min late)")

          body = {
              "board_id":    entry["board_id"],
              "title":       entry["title"],
              "description": entry["description"],
              "link":        entry.get("link"),
              "media_source": {
                  "source_type": "image_url",
                  "url":         entry["image_url"],
              },
          }
          resp = api_post("/pins", body, "Create pin")
          pin_id = resp.json()["id"]
          print(f"Published! Pin ID: {pin_id}")

          schedule[entry_idx]["status"]       = "published"
          schedule[entry_idx]["pin_id"]       = pin_id
          schedule[entry_idx]["published_at"] = now_moscow.isoformat()

          with open("pinterest-schedule.json", "w", encoding="utf-8") as f:
              json.dump(schedule, f, ensure_ascii=False, indent=2)
          print("pinterest-schedule.json updated.")
          EOF

      - name: Commit updated schedule
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add pinterest-schedule.json
          git diff --staged --quiet || git commit -m "Published pin $(date -u +%Y-%m-%d\ %H:%M) UTC"
          # Публикация уже состоялась — статус обязан доехать, иначе следующий запуск
          # отправит тот же пост повторно. Пуш в main может отбить чужой коммит
          # (человек или другой воркфлоу), поэтому перед повтором подтягиваем main
          # ребейзом: наш коммит трогает только своё расписание и конфликтовать
          # ему не с чем.
          for i in 1 2 3; do
            git push && exit 0
            echo "push отбит, подтягиваю main (попытка $i)"
            git pull --rebase origin main || exit 1
          done
          git push
