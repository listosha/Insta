<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<title>Case cards · горизонтальные обложки TG/MAX</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: #d9d9d9; font-family: 'Segoe UI', -apple-system, BlinkMacSystemFont, sans-serif; padding: 30px; }
  .card {
    width: 1280px; height: 720px;
    display: flex; flex-direction: column; justify-content: space-between;
    padding: 70px 80px; position: relative; overflow: hidden;
    margin: 0 auto 30px;
  }
  .eyebrow { font-size: 26px; font-weight: 800; letter-spacing: 5px; text-transform: uppercase; }
  .mid { flex: 1; display: flex; flex-direction: column; justify-content: center; }
  .headline { font-size: 80px; font-weight: 800; line-height: 1.05; letter-spacing: -1px; }
  .headline.sm { font-size: 66px; }
  .sub { font-size: 38px; font-weight: 500; margin-top: 26px; opacity: 0.82; }
  .footer { display: flex; justify-content: space-between; align-items: flex-end; }
  .footL { display: flex; align-items: center; gap: 22px; }
  .badge { font-size: 30px; font-weight: 800; padding: 13px 30px; border-radius: 100px; letter-spacing: 1px; }
  .cont { font-size: 30px; font-weight: 600; opacity: 0.85; }
  .brand { font-size: 26px; font-weight: 700; opacity: 0.7; text-align: right; }
</style>
</head>
<body>
<div id="root"></div>
<script>
// Единая фиолетовая схема для всех обложек (как в кейсе 09).
const THEMES = {
  purple_white: { bg:'#FFFFFF', accent:'#6B21A8', accentText:'#FFFFFF', text:'#111111' }
};
const THEME = 'purple_white';

// Имена файлов без фамилий: case-NN. data-name -> case-NN-p1 / case-NN-p2.
const CASES = [
  { name:'case-02',
    p1:{ h:'К вечеру давление 160. А утром идеально.', s:'Кардиологи разводят руками' },
    p2:{ h:'Дело не в сердце. А в кортизоле.', s:'Что подсказала горячая вода' } },
  { name:'case-10',
    p1:{ h:'Статины назначили по одной цифре', s:'Ни инфарктов, ни событий' },
    p2:{ h:'Холестерин идеальный. А печень поехала.', s:'' } },
  { name:'case-09',
    p1:{ h:'Приступы 30 лет глушили антидепрессантами', s:'«Пить пожизненно», сказали врачи' },
    p2:{ h:'Корень нашёлся в мазке из горла', s:'' } },
  { name:'case-11',
    p1:{ h:'Бегает по 10 км натощак. Ферритин 13.', s:'И почти не жалуется' },
    p2:{ h:'Три места, где утекает её железо', s:'' } },
  { name:'case-01',
    p1:{ h:'Пульс 100 в покое. По меркам здорова.', s:'А к чему придраться, не знает' },
    p2:{ h:'Почему B12 на дне, сколько ни пей', s:'' } },
  { name:'case-03',
    p1:{ h:'Узел в щитовидке. Категория 4A.', s:'Заговорили про пункцию' },
    p2:{ h:'Уменьшился вдвое. Без операции.', s:'' } },
  { name:'case-12',
    p1:{ h:'700 волос в сутки. Считала сама.', s:'Семьдесят процентов ушло' },
    p2:{ h:'Волосы тут только индикатор', s:'' } },
  { name:'case-04',
    p1:{ h:'Все анализы идеальные. А сил нет.', s:'Раньше бегала по 10 км' },
    p2:{ h:'Кто держит палец на тормозе', s:'' } },
  { name:'case-05',
    p1:{ h:'Кремень. А к вечеру будто гасят свет.', s:'Скорая: давление под 180' },
    p2:{ h:'Тело в режиме выживания', s:'' } },
  { name:'case-06',
    p1:{ h:'Всё делает правильно. Ферритин на дне.', s:'Железо пьёт каждый день' },
    p2:{ h:'Кто держит её железо внизу', s:'' } },
  { name:'case-13',
    p1:{ h:'Анализ крови это всего лишь снимок', s:'Сделанный в неудачный момент' },
    p2:{ h:'Либо лечим иммунитет, либо беременеем', s:'' } },
  { name:'case-08',
    p1:{ h:'Врач: всё отлично. А человек мёрзнет.', s:'Холодные руки с детства' },
    p2:{ h:'Инфекция ест железо и крадёт прогестерон', s:'' } },
  { name:'case-07',
    p1:{ h:'Аутоиммунный маркер 1280. Пугает.', s:'«Я же ничего такого не ела»' },
    p2:{ h:'Виновата привычная банка эхинацеи', s:'' } }
];

const root = document.getElementById('root');

function card(part, name, data) {
  const t = THEMES[THEME];
  const isP1 = part === 1;
  const badgeTxt = isP1 ? 'ЧАСТЬ 1' : 'ЧАСТЬ 2';
  const contTxt  = isP1 ? 'продолжение сегодня в 18:30' : 'финал кейса';
  const longHead = data.h.length > 34;
  const el = document.createElement('div');
  el.className = 'card';
  el.setAttribute('data-name', name + (isP1 ? '-p1' : '-p2'));
  el.style.background = t.bg;
  el.style.color = t.text;
  el.innerHTML =
    '<div class="eyebrow" style="color:' + t.accent + '">Разбор с консультации'
      + '<span style="display:block;width:86px;height:6px;margin-top:18px;border-radius:3px;background:' + t.accent + '"></span></div>'
    + '<div class="mid"><div class="headline' + (longHead ? ' sm' : '') + '">' + data.h + '</div>'
      + (data.s ? '<div class="sub">' + data.s + '</div>' : '') + '</div>'
    + '<div class="footer"><div class="footL">'
      + '<span class="badge" style="background:' + t.accent + ';color:' + t.accentText + '">' + badgeTxt + '</span>'
      + '<span class="cont">' + contTxt + '</span></div>'
      + '<div class="brand">Алексей Листошенков<br>нутрициолог</div></div>';
  return el;
}

for (const c of CASES) {
  root.appendChild(card(1, c.name, c.p1));
  root.appendChild(card(2, c.name, c.p2));
}
</script>
</body>
</html>
