<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Карусели «Консультация» · Май 2026 · Все 9 (v2)</title>
<style>
* { box-sizing: border-box; }
body { margin: 0; padding: 24px; background: #f0f0f0; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; }
.page-title { font-size: 22px; font-weight: 700; color: #222; margin-bottom: 6px; }
.page-sub { font-size: 13px; color: #888; margin-bottom: 32px; }

.series { background: white; border-radius: 12px; margin-bottom: 48px; overflow: hidden; box-shadow: 0 2px 12px rgba(0,0,0,0.1); }
.series-header { padding: 20px 24px 0; border-bottom: 1px solid #eee; padding-bottom: 16px; }
.series-num { font-size: 11px; font-weight: 700; letter-spacing: 2px; text-transform: uppercase; color: #aaa; margin-bottom: 4px; }
.series-title { font-size: 18px; font-weight: 700; color: #222; margin-bottom: 8px; }
.series-meta { display: flex; gap: 20px; font-size: 12px; flex-wrap: wrap; }
.meta-tag { display: inline-flex; align-items: center; gap: 5px; }
.meta-tag .dot { width: 10px; height: 10px; border-radius: 50%; }

.post-caption-block { margin: 0; padding: 18px 24px; background: #fafafa; border-left: 0; }
.post-caption-label { font-size: 10px; font-weight: 700; letter-spacing: 2px; text-transform: uppercase; color: #bbb; margin-bottom: 8px; display: flex; align-items: center; gap: 8px; }
.post-caption-label::after { content: ''; flex: 1; height: 1px; background: #e8e8e8; }
.slot-badge { display: inline-block; background: #222; color: #fff; font-size: 11px; font-weight: 700; padding: 3px 10px; border-radius: 20px; letter-spacing: 1px; margin-left: 8px; }
.post-text { font-size: 14px; line-height: 1.65; color: #444; white-space: pre-wrap; font-family: Georgia, serif; }

.slides { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; padding: 16px 20px 20px; }
@media (max-width: 700px) { .slides { grid-template-columns: repeat(2, 1fr); } }

.slide-wrap { border-radius: 8px; overflow: hidden; box-shadow: 0 1px 6px rgba(0,0,0,0.1); }
.slide-wrap svg { width: 100%; height: auto; display: block; }
.slide-label { padding: 6px 10px; font-size: 10px; color: #888; background: #f7f7f7; border-top: 1px solid #eee; letter-spacing: 0.5px; }
</style>

<body>

<div class="page-title">Карусели «Консультация» · Май 2026 (v2)</div>

<div id="root"></div>

<script>
const THEMES = {
  red_white: { name: 'Red + White', swatch: '#CC0000', bg: '#FFFFFF', accent: '#CC0000', accentB: '#990000', text: '#111111', textSoft: '#555555', accentText: '#FFFFFF' },
  orange_white: { name: 'Orange + White', swatch: '#E05800', bg: '#FFFFFF', accent: '#E05800', accentB: '#B34400', text: '#111111', textSoft: '#555555', accentText: '#FFFFFF' },
  purple_white: { name: 'Purple + White', swatch: '#6B21A8', bg: '#FFFFFF', accent: '#6B21A8', accentB: '#4C1572', text: '#111111', textSoft: '#555555', accentText: '#FFFFFF' },
  fuchsia_white: { name: 'Fuchsia + White', swatch: '#C026D3', bg: '#FFFFFF', accent: '#C026D3', accentB: '#86198F', text: '#111111', textSoft: '#555555', accentText: '#FFFFFF' },
  black_orange: { name: 'Black + Orange', swatch: '#1A1A1A', bg: '#1A1A1A', accent: '#E05800', accentB: '#FF7020', text: '#F5F5F5', textSoft: '#BBBBBB', accentText: '#FFFFFF' },
  black_red: { name: 'Black + Red', swatch: '#1A1A1A', bg: '#1A1A1A', accent: '#CC0000', accentB: '#FF3333', text: '#F5F5F5', textSoft: '#BBBBBB', accentText: '#FFFFFF' },
  teal_white: { name: 'Teal + White', swatch: '#0F766E', bg: '#FFFFFF', accent: '#0F766E', accentB: '#0D5C57', text: '#111111', textSoft: '#555555', accentText: '#FFFFFF' },
  indigo_white: { name: 'Indigo + White', swatch: '#4338CA', bg: '#FFFFFF', accent: '#4338CA', accentB: '#3730A3', text: '#111111', textSoft: '#555555', accentText: '#FFFFFF' },
  black_teal: { name: 'Black + Teal', swatch: '#111111', bg: '#111111', accent: '#14B8A6', accentB: '#0D9488', text: '#F5F5F5', textSoft: '#AAAAAA', accentText: '#111111' }
};

function esc(s) { return String(s || '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }

function fitText(text, maxChars, maxLines, baseFontSize) {
  if (!text) return { lines: [], fontSize: baseFontSize };
  function wrap(charsPerLine) {
    const paragraphs = String(text).split(/\n+/);
    const out = [];
    for (const para of paragraphs) {
      const words = para.split(/\s+/).filter(Boolean);
      let current = '';
      for (const word of words) {
        const candidate = current ? current + ' ' + word : word;
        if (candidate.length <= charsPerLine) current = candidate;
        else { if (current) out.push(current); current = word; }
      }
      if (current) out.push(current);
    }
    return out;
  }
  let scale = 1, fontSize = baseFontSize, chars = maxChars;
  let lines = wrap(chars);
  while (lines.length > maxLines && scale < 1.5) {
    scale += 0.05;
    fontSize = baseFontSize / scale;
    chars = Math.floor(maxChars * scale);
    lines = wrap(chars);
  }
  if (lines.length > maxLines) {
    lines = lines.slice(0, maxLines);
    const last = lines[maxLines - 1];
    if (last && last.length > 3) lines[maxLines - 1] = last.slice(0, -2) + '...';
  }
  return { lines, fontSize };
}

function iconPath(name, size) {
  const s = size;
  const paths = {
    iron: `<path d="M ${s*0.5} ${s*0.1} C ${s*0.2} ${s*0.5}, ${s*0.2} ${s*0.85}, ${s*0.5} ${s*0.9} C ${s*0.8} ${s*0.85}, ${s*0.8} ${s*0.5}, ${s*0.5} ${s*0.1} Z"/><path d="M ${s*0.35} ${s*0.55} Q ${s*0.5} ${s*0.45}, ${s*0.65} ${s*0.55}"/>`,
    molecule: `<circle cx="${s*0.5}" cy="${s*0.25}" r="${s*0.1}"/><circle cx="${s*0.25}" cy="${s*0.7}" r="${s*0.1}"/><circle cx="${s*0.75}" cy="${s*0.7}" r="${s*0.1}"/><line x1="${s*0.45}" y1="${s*0.33}" x2="${s*0.3}" y2="${s*0.62}"/><line x1="${s*0.55}" y1="${s*0.33}" x2="${s*0.7}" y2="${s*0.62}"/><line x1="${s*0.35}" y1="${s*0.7}" x2="${s*0.65}" y2="${s*0.7}"/>`,
    drop: `<path d="M ${s*0.5} ${s*0.15} C ${s*0.3} ${s*0.4}, ${s*0.2} ${s*0.65}, ${s*0.5} ${s*0.9} C ${s*0.8} ${s*0.65}, ${s*0.7} ${s*0.4}, ${s*0.5} ${s*0.15} Z"/>`,
    wave: `<path d="M ${s*0.1} ${s*0.5} Q ${s*0.3} ${s*0.3}, ${s*0.5} ${s*0.5} Q ${s*0.7} ${s*0.7}, ${s*0.9} ${s*0.5}"/><path d="M ${s*0.1} ${s*0.65} Q ${s*0.3} ${s*0.45}, ${s*0.5} ${s*0.65} Q ${s*0.7} ${s*0.85}, ${s*0.9} ${s*0.65}"/>`,
    spark: `<path d="M ${s*0.5} ${s*0.05} L ${s*0.62} ${s*0.38} L ${s*0.95} ${s*0.38} L ${s*0.69} ${s*0.59} L ${s*0.79} ${s*0.95} L ${s*0.5} ${s*0.73} L ${s*0.21} ${s*0.95} L ${s*0.31} ${s*0.59} L ${s*0.05} ${s*0.38} L ${s*0.38} ${s*0.38} Z"/>`,
    gut: `<path d="M ${s*0.3} ${s*0.15} Q ${s*0.6} ${s*0.1}, ${s*0.65} ${s*0.35} Q ${s*0.7} ${s*0.55}, ${s*0.5} ${s*0.6} Q ${s*0.3} ${s*0.65}, ${s*0.35} ${s*0.8} Q ${s*0.4} ${s*0.95}, ${s*0.65} ${s*0.9}"/>`,
    capsule: `<rect x="${s*0.28}" y="${s*0.3}" width="${s*0.44}" height="${s*0.4}" rx="${s*0.2}"/><line x1="${s*0.5}" y1="${s*0.3}" x2="${s*0.5}" y2="${s*0.7}"/>`
  };
  return paths[name] || '';
}

function iconGroup(name, size, color, strokeW) {
  const path = iconPath(name, size);
  if (!path) return '';
  return `<g fill="none" stroke="${color}" stroke-width="${strokeW}" stroke-linecap="round" stroke-linejoin="round">${path}</g>`;
}

function renderFooter(t, w, h) {
  const isLight = t.bg === '#FFFFFF' || t.bg.startsWith('#F');
  const color = isLight ? t.accent : t.accentB;
  let svg = '';
  svg += `<text x="${w*0.92}" y="${h*0.952}" font-family="Georgia,serif" font-size="${w*0.026}" fill="${color}" font-weight="700" text-anchor="end" letter-spacing="1" opacity="0.8">listoshenkov.ru</text>`;
  svg += `<text x="${w*0.92}" y="${h*0.975}" font-family="Georgia,serif" font-size="${w*0.022}" fill="${color}" font-weight="700" text-anchor="end" letter-spacing="1" opacity="0.55">ссылка в био</text>`;
  return svg;
}

function renderSlide(slide, t, idx) {
  const w = 1080, h = 1350;
  const baseFont = 'Georgia, serif';
  const hasIcon = slide.icon && slide.icon !== 'none';
  let svg = `<svg viewBox="0 0 ${w} ${h}" xmlns="http://www.w3.org/2000/svg">`;

  switch(slide.layout) {
    case 'cover': {
      const titleFit = fitText(slide.title, 14, 4, w * 0.100);
      const subFit = fitText(slide.subtitle || '', 30, 2, w * 0.046);
      const titleLH = 1.18, subLH = 1.2;
      const titleBlockH = titleFit.lines.length * titleFit.fontSize * titleLH;
      const subBlockH = subFit.lines.length * subFit.fontSize * subLH;
      const gap = subFit.lines.length ? h * 0.035 : 0;
      const totalH = subBlockH + gap + titleBlockH;
      const blockTop = h * 0.52 - totalH / 2;
      const subStartY = blockTop + subFit.fontSize * 0.85;
      const titleStartY = blockTop + subBlockH + gap + titleFit.fontSize * 0.85;

      svg += `<rect width="${w}" height="${h}" fill="${t.bg}"/>`;
      svg += `<rect x="0" y="0" width="${w}" height="${w*0.007}" fill="${t.accent}"/>`;
      svg += `<ellipse cx="${w*0.88}" cy="${h*0.18}" rx="${w*0.32}" ry="${w*0.3}" fill="${t.accent}" opacity="0.08"/>`;
      svg += `<ellipse cx="${w*0.1}" cy="${h*0.85}" rx="${w*0.18}" ry="${w*0.18}" fill="${t.accent}" opacity="0.06"/>`;
      if (hasIcon) svg += `<g opacity="0.22" fill="none" stroke="${t.accent}" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round" transform="translate(${w*0.72}, ${h*0.06})">${iconGroup(slide.icon, w*0.22, t.accent, 3.5)}</g>`;
      subFit.lines.forEach((line, i) => {
        svg += `<text x="${w*0.08}" y="${subStartY + i*subFit.fontSize*subLH}" font-family="${baseFont}" font-size="${subFit.fontSize}" fill="${t.accent}" font-weight="700" font-style="italic" letter-spacing="2">${esc(line.toUpperCase())}</text>`;
      });
      titleFit.lines.forEach((line, i) => {
        const isLast = i === titleFit.lines.length - 1;
        svg += `<text x="${w*0.08}" y="${titleStartY + i*titleFit.fontSize*titleLH}" font-family="${baseFont}" font-size="${titleFit.fontSize}" fill="${isLast ? t.accent : t.text}" font-weight="700">${esc(line)}</text>`;
      });
      svg += `<rect x="${w*0.08}" y="${h*0.87}" width="${w*0.15}" height="${h*0.008}" fill="${t.accent}"/>`;
      svg += `<rect x="${w*0.09}" y="${h*0.882}" width="${w*0.10}" height="${h*0.006}" fill="${t.accentB}" opacity="0.7"/>`;
      const ftY = h * 0.92, ftH = h * 0.05;
      svg += `<rect x="${w*0.06}" y="${ftY}" width="${w*0.48}" height="${ftH}" rx="12" fill="${t.accent}" opacity="0.08"/>`;
      svg += `<text x="${w*0.08}" y="${ftY + ftH*0.66}" font-family="${baseFont}" font-size="${w*0.030}" fill="${t.accent}" font-weight="700" letter-spacing="3">СВАЙП →</text>`;
      svg += renderFooter(t, w, h);
      break;
    }
    case 'text': {
      const titleFit = fitText(slide.title, 18, 3, w * 0.075);
      const subFit = fitText(slide.subtitle || '', 26, 2, w * 0.048);
      const titleStartY = h * 0.24;
      const titleBlockH = titleFit.lines.length * titleFit.fontSize * 1.12;
      const subBlockH = subFit.lines.length * subFit.fontSize * 1.15;
      const subGap = subFit.lines.length ? h*0.03 : 0;
      const bodyStartY = titleStartY + titleBlockH + (subFit.lines.length ? subBlockH + subGap : 0) + h * 0.055;
      const bodyEndY = h * 0.86;
      const bodyAvailH = bodyEndY - bodyStartY;
      const bodyLH = 1.32;
      let bodyFontBase = w * 0.054;
      let bodyFit;
      for (let attempt = 0; attempt < 8; attempt++) {
        const charsScale = (w * 0.054) / bodyFontBase;
        bodyFit = fitText(slide.body, Math.floor(26 * charsScale), 12, bodyFontBase);
        if (bodyFit.lines.length * bodyFit.fontSize * bodyLH <= bodyAvailH) break;
        bodyFontBase *= 0.94;
      }
      svg += `<rect width="${w}" height="${h}" fill="${t.bg}"/>`;
      if (hasIcon) svg += `<g transform="translate(${w*0.075}, ${h*0.042})">${iconGroup(slide.icon, w*0.065, t.accent, 2.8)}</g>`;
      svg += `<rect x="${w*0.08}" y="${h*0.14}" width="${w*0.1}" height="${h*0.01}" fill="${t.accent}"/>`;
      titleFit.lines.forEach((line, i) => {
        const isLast = i === titleFit.lines.length - 1;
        svg += `<text x="${w*0.08}" y="${titleStartY + i*titleFit.fontSize*1.12}" font-family="${baseFont}" font-size="${titleFit.fontSize}" fill="${isLast ? t.accent : t.text}" font-weight="700">${esc(line)}</text>`;
      });
      subFit.lines.forEach((line, i) => {
        svg += `<text x="${w*0.08}" y="${titleStartY + titleBlockH + subGap + i*subFit.fontSize*1.15}" font-family="${baseFont}" font-size="${subFit.fontSize}" fill="${t.accent}" font-weight="400" font-style="italic">${esc(line)}</text>`;
      });
      bodyFit.lines.forEach((line, i) => {
        svg += `<text x="${w*0.08}" y="${bodyStartY + i*bodyFit.fontSize*bodyLH}" font-family="${baseFont}" font-size="${bodyFit.fontSize}" fill="${t.textSoft}" font-weight="400">${esc(line)}</text>`;
      });
      if (hasIcon) svg += `<g opacity="0.12" transform="translate(${w*0.73}, ${h*0.82})">${iconGroup(slide.icon, w*0.19, t.accent, 3)}</g>`;
      svg += renderFooter(t, w, h);
      break;
    }
    case 'quote': {
      const cardTop = h * 0.24, cardH = h * 0.50;
      const lineH = 1.22;
      let qFontBase = w * 0.065;
      let bodyFit;
      for (let attempt = 0; attempt < 8; attempt++) {
        const charsScale = (w * 0.065) / qFontBase;
        bodyFit = fitText(slide.body, Math.floor(22 * charsScale), 10, qFontBase);
        if (bodyFit.lines.length * bodyFit.fontSize * lineH <= cardH * 0.88) break;
        qFontBase *= 0.93;
      }
      const textBlockH = bodyFit.lines.length * bodyFit.fontSize * lineH;
      const textStartY = cardTop + (cardH / 2) - (textBlockH / 2) + bodyFit.fontSize * 0.85;
      svg += `<rect width="${w}" height="${h}" fill="${t.bg}"/>`;
      svg += `<rect width="${w}" height="${h}" fill="${t.accent}" opacity="0.05"/>`;
      svg += `<text x="${w*0.10}" y="${cardTop + h*0.08}" font-family="${baseFont}" font-size="${w*0.34}" fill="${t.accent}" opacity="0.09" font-weight="700">"</text>`;
      svg += `<rect x="${w*0.08}" y="${h*0.14}" width="${w*0.08}" height="${h*0.009}" fill="${t.accent}"/>`;
      svg += `<rect x="${w*0.08}" y="${cardTop + cardH - h*0.01}" width="${w*0.92 - w*0.08}" height="1" fill="${t.accent}" opacity="0.15"/>`;
      bodyFit.lines.forEach((line, i) => {
        svg += `<text x="${w*0.14}" y="${textStartY + i*bodyFit.fontSize*lineH}" font-family="${baseFont}" font-size="${bodyFit.fontSize}" fill="${t.text}" font-weight="400" font-style="italic">${esc(line)}</text>`;
      });
      svg += `<rect x="${w*0.08}" y="${h*0.87}" width="${w*0.12}" height="${h*0.006}" fill="${t.accent}"/>`;
      svg += renderFooter(t, w, h);
      break;
    }
    case 'list': {
      const titleFit = fitText(slide.title, 18, 2, w * 0.075);
      const titleStartY = h * 0.24;
      const titleBlockH = titleFit.lines.length * titleFit.fontSize * 1.12;
      const listStartY = titleStartY + titleBlockH + h * 0.05;
      const listEndY = h * 0.87;
      const availH = listEndY - listStartY;
      const rawItems = (slide.items || []).filter(x => x);
      const n = rawItems.length;
      const itemLH = 1.22;
      let itemFontBase = w * 0.052;
      let itemFits = [];
      for (let attempt = 0; attempt < 12; attempt++) {
        const charsScale = (w * 0.052) / itemFontBase;
        itemFits = rawItems.map(it => fitText(it, Math.floor(28 * charsScale), 3, itemFontBase));
        const totalH = itemFits.reduce((sum, fit) => sum + fit.lines.length * fit.fontSize * itemLH + itemFontBase * 0.7, 0);
        if (totalH <= availH) break;
        itemFontBase *= 0.93;
      }
      svg += `<rect width="${w}" height="${h}" fill="${t.bg}"/>`;
      if (hasIcon) svg += `<g transform="translate(${w*0.075}, ${h*0.042})">${iconGroup(slide.icon, w*0.065, t.accent, 2.8)}</g>`;
      svg += `<rect x="${w*0.08}" y="${h*0.14}" width="${w*0.1}" height="${h*0.01}" fill="${t.accent}"/>`;
      titleFit.lines.forEach((line, i) => {
        const isLast = i === titleFit.lines.length - 1;
        svg += `<text x="${w*0.08}" y="${titleStartY + i*titleFit.fontSize*1.12}" font-family="${baseFont}" font-size="${titleFit.fontSize}" fill="${isLast ? t.accent : t.text}" font-weight="700">${esc(line)}</text>`;
      });
      let curY = listStartY;
      itemFits.forEach((fit, i) => {
        const isLast = i === n - 1;
        const lineH = fit.fontSize * itemLH;
        const firstBaselineY = curY + fit.fontSize * 0.85;
        const bulletCY = firstBaselineY - fit.fontSize * 0.32;
        const bulletR = w * 0.028;
        svg += `<circle cx="${w*0.12}" cy="${bulletCY}" r="${bulletR}" fill="${isLast ? t.accentB : t.accent}"/>`;
        svg += `<text x="${w*0.12}" y="${bulletCY + bulletR*0.42}" font-family="${baseFont}" font-size="${w*0.028}" fill="${t.accentText}" font-weight="700" text-anchor="middle">${i+1}</text>`;
        fit.lines.forEach((line, li) => {
          svg += `<text x="${w*0.19}" y="${firstBaselineY + li*lineH}" font-family="${baseFont}" font-size="${fit.fontSize}" fill="${t.text}" font-weight="400">${esc(line)}</text>`;
        });
        curY += fit.lines.length * lineH + itemFontBase * 0.7;
      });
      svg += renderFooter(t, w, h);
      break;
    }
    case 'accent': {
      const titleFit = fitText(slide.title, 16, 3, w * 0.090);
      const titleStartY = h * 0.28;
      const titleBlockH = titleFit.lines.length * titleFit.fontSize * 1.15;
      const bodyStartY = titleStartY + titleBlockH + h * 0.06;
      const bodyEndY = h * 0.88;
      const bodyAvailH = bodyEndY - bodyStartY;
      const bodyLH = 1.28;
      let bodyFontBase = w * 0.054;
      let bodyFit;
      for (let attempt = 0; attempt < 8; attempt++) {
        const charsScale = (w * 0.054) / bodyFontBase;
        bodyFit = fitText(slide.body, Math.floor(24 * charsScale), 12, bodyFontBase);
        if (bodyFit.lines.length * bodyFit.fontSize * bodyLH <= bodyAvailH) break;
        bodyFontBase *= 0.94;
      }
      svg += `<rect width="${w}" height="${h}" fill="${t.accent}"/>`;
      svg += `<ellipse cx="${w*0.9}" cy="${h*0.88}" rx="${w*0.3}" ry="${w*0.27}" fill="${t.bg}" opacity="0.05"/>`;
      svg += `<rect x="${w*0.08}" y="${h*0.14}" width="${w*0.1}" height="${h*0.01}" fill="${t.accentB}"/>`;
      titleFit.lines.forEach((line, i) => {
        const isLast = i === titleFit.lines.length - 1;
        svg += `<text x="${w*0.08}" y="${titleStartY + i*titleFit.fontSize*1.15}" font-family="${baseFont}" font-size="${titleFit.fontSize}" fill="${isLast ? t.accentB : t.bg}" font-weight="700">${esc(line)}</text>`;
      });
      svg += `<line x1="${w*0.08}" y1="${bodyStartY - h*0.025}" x2="${w*0.92}" y2="${bodyStartY - h*0.025}" stroke="${t.bg}" stroke-width="1" opacity="0.2"/>`;
      bodyFit.lines.forEach((line, i) => {
        svg += `<text x="${w*0.08}" y="${bodyStartY + i*bodyFit.fontSize*bodyLH}" font-family="${baseFont}" font-size="${bodyFit.fontSize}" fill="${t.bg}" font-weight="400" opacity="0.94">${esc(line)}</text>`;
      });
      svg += `<text x="${w*0.92}" y="${h*0.952}" font-family="${baseFont}" font-size="${w*0.026}" fill="${t.bg}" font-weight="700" text-anchor="end" letter-spacing="1" opacity="0.7">listoshenkov.ru</text>`;
      svg += `<text x="${w*0.92}" y="${h*0.975}" font-family="${baseFont}" font-size="${w*0.022}" fill="${t.bg}" font-weight="700" text-anchor="end" letter-spacing="1" opacity="0.5">ссылка в био</text>`;
      break;
    }
    case 'number': {
      const titleFit = fitText(slide.title, 16, 3, w * 0.090);
      const titleStartY = h * 0.34;
      const titleBlockH = titleFit.lines.length * titleFit.fontSize * 1.2;
      const bodyStartY = titleStartY + titleBlockH + h * 0.05;
      const bodyEndY = h * 0.87;
      const bodyAvailH = bodyEndY - bodyStartY;
      const bodyLH = 1.28;
      let bodyFontBase = w * 0.054;
      let bodyFit;
      for (let attempt = 0; attempt < 8; attempt++) {
        const charsScale = (w * 0.054) / bodyFontBase;
        bodyFit = fitText(slide.body, Math.floor(24 * charsScale), 12, bodyFontBase);
        if (bodyFit.lines.length * bodyFit.fontSize * bodyLH <= bodyAvailH) break;
        bodyFontBase *= 0.94;
      }
      const numLabel = slide.numLabel || (idx != null ? String(idx + 1).padStart(2, '0') : '01');
      svg += `<rect width="${w}" height="${h}" fill="${t.bg}"/>`;
      svg += `<text x="${w*0.12}" y="${h*0.22}" font-family="${baseFont}" font-size="${w*0.20}" fill="${t.accent}" font-weight="700" opacity="0.12">${esc(numLabel)}</text>`;
      svg += `<rect x="${w*0.08}" y="${h*0.14}" width="${w*0.08}" height="${h*0.01}" fill="${t.accent}"/>`;
      titleFit.lines.forEach((line, i) => {
        svg += `<text x="${w*0.08}" y="${titleStartY + i*titleFit.fontSize*1.12}" font-family="${baseFont}" font-size="${titleFit.fontSize}" fill="${t.text}" font-weight="700">${esc(line)}</text>`;
      });
      svg += `<line x1="${w*0.08}" y1="${bodyStartY - h*0.02}" x2="${w*0.92}" y2="${bodyStartY - h*0.02}" stroke="${t.accent}" stroke-width="1" opacity="0.3"/>`;
      bodyFit.lines.forEach((line, i) => {
        svg += `<text x="${w*0.08}" y="${bodyStartY + i*bodyFit.fontSize*bodyLH}" font-family="${baseFont}" font-size="${bodyFit.fontSize}" fill="${t.textSoft}" font-weight="400">${esc(line)}</text>`;
      });
      svg += renderFooter(t, w, h);
      break;
    }
    case 'cta': {
      const titleFit = fitText(slide.title, 20, 3, w * 0.078);
      const subtitleFit = fitText(slide.subtitle || '', 26, 2, w * 0.050);
      const titleBlockH = titleFit.lines.length * titleFit.fontSize * 1.18;
      const titleStartY = h * 0.13;
      svg += `<rect width="${w}" height="${h}" fill="${t.bg}"/>`;
      svg += `<ellipse cx="${w*0.5}" cy="${h*0.50}" rx="${w*0.52}" ry="${w*0.52}" fill="${t.accent}" opacity="0.05"/>`;
      svg += `<ellipse cx="${w*0.5}" cy="${h*0.50}" rx="${w*0.34}" ry="${w*0.34}" fill="${t.accentB}" opacity="0.07"/>`;
      if (hasIcon) svg += `<g opacity="0.8" transform="translate(${w*0.42}, ${h*0.24})">${iconGroup(slide.icon, w*0.16, t.accent, 3.5)}</g>`;
      titleFit.lines.forEach((line, i) => {
        svg += `<text x="${w*0.5}" y="${titleStartY + i*titleFit.fontSize*1.18}" font-family="${baseFont}" font-size="${titleFit.fontSize}" fill="${t.text}" font-weight="700" text-anchor="middle">${esc(line)}</text>`;
      });
      subtitleFit.lines.forEach((line, i) => {
        svg += `<text x="${w*0.5}" y="${titleStartY + titleBlockH + h*0.03 + i*subtitleFit.fontSize*1.2}" font-family="${baseFont}" font-size="${subtitleFit.fontSize}" fill="${t.textSoft}" font-weight="400" text-anchor="middle">${esc(line)}</text>`;
      });
      const btnY = h * 0.52, btnH = h * 0.16, btnX = w * 0.07, btnW = w * 0.86;
      svg += `<rect x="${btnX}" y="${btnY}" width="${btnW}" height="${btnH}" rx="${btnH/2}" fill="${t.accent}"/>`;
      svg += `<text x="${w*0.5}" y="${btnY + btnH*0.30}" font-family="${baseFont}" font-size="${w*0.050}" fill="${t.accentText}" font-weight="700" text-anchor="middle" letter-spacing="2">ЗАПИСАТЬСЯ</text>`;
      svg += `<text x="${w*0.5}" y="${btnY + btnH*0.62}" font-family="${baseFont}" font-size="${w*0.036}" fill="${t.accentText}" font-weight="400" text-anchor="middle" opacity="0.95">в разделе «Консультация»</text>`;
      svg += `<text x="${w*0.5}" y="${btnY + btnH*0.88}" font-family="${baseFont}" font-size="${w*0.034}" fill="${t.accentText}" font-weight="400" text-anchor="middle" opacity="0.90">в приложении</text>`;
      svg += `<rect x="${w*0.36}" y="${h*0.82}" width="${w*0.28}" height="1.5" fill="${t.accent}" opacity="0.25"/>`;
      svg += `<text x="${w*0.5}" y="${h*0.89}" font-family="${baseFont}" font-size="${w*0.036}" fill="${t.accent}" font-weight="700" text-anchor="middle" letter-spacing="3">LISTOSHENKOV.RU</text>`;
      svg += `<text x="${w*0.5}" y="${h*0.965}" font-family="${baseFont}" font-size="${w*0.028}" fill="${t.textSoft}" font-weight="400" text-anchor="middle">ссылка в био</text>`;
      break;
    }
  }
  svg += `</svg>`;
  return svg;
}

const root = document.getElementById('root');
SERIES.forEach(series => {
  const t = THEMES[series.theme];
  const section = document.createElement('div');
  section.className = 'series';
  const header = document.createElement('div');
  header.className = 'series-header';
  header.innerHTML = `<div class="series-num">Карусель ${series.id} из ${SERIES.length}</div><div class="series-title">${series.title}</div><div class="series-meta"><span class="meta-tag"><span class="dot" style="background:${t.swatch}"></span><span class="meta-label">Тема:</span>&nbsp;<span class="meta-value">${t.name}</span></span><span class="meta-tag"><span class="meta-label">Публикация:</span>&nbsp;<span class="meta-value">${series.slot}</span></span><span class="meta-tag"><span class="meta-label">Слайдов:</span>&nbsp;<span class="meta-value">${series.slides.length}</span></span></div>`;
  section.appendChild(header);
  const captionBlock = document.createElement('div');
  captionBlock.className = 'post-caption-block';
  captionBlock.style.borderLeft = `4px solid ${t.swatch}`;
  captionBlock.style.padding = '16px 24px';
  captionBlock.style.background = '#f8f8f8';
  captionBlock.innerHTML = `<div class="post-caption-label">ТЕКСТ ПОСТА ДЛЯ ИНСТАГРАМ<span class="slot-badge">${series.slot}</span></div><div class="post-text">${series.caption}</div>`;
  section.appendChild(captionBlock);
  const slidesGrid = document.createElement('div');
  slidesGrid.className = 'slides';
  series.slides.forEach((slide, idx) => {
    const wrap = document.createElement('div');
    wrap.className = 'slide-wrap';
    wrap.innerHTML = renderSlide(slide, t, idx);
    const lbl = document.createElement('div');
    lbl.className = 'slide-label';
    lbl.textContent = `${idx + 1}/${series.slides.length}  ·  ${slide.layout}`;
    wrap.appendChild(lbl);
    slidesGrid.appendChild(wrap);
  });
  section.appendChild(slidesGrid);
  root.appendChild(section);
});
</script>
