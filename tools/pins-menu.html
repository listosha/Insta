function esc(s){return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');}
function fitText(text,maxChars,maxLines,baseFontSize){
  if(!text)return{lines:[],fontSize:baseFontSize};
  function wrap(cpl){const out=[];for(const para of String(text).split(/\n+/)){const ws=para.split(/\s+/).filter(Boolean);let c='';for(const w of ws){const cand=c?c+' '+w:w;if(cand.length<=cpl)c=cand;else{if(c)out.push(c);c=w;}}if(c)out.push(c);}return out;}
  let scale=1,fontSize=baseFontSize,chars=maxChars,lines=wrap(chars);
  while(lines.length>maxLines&&scale<1.7){scale+=0.05;fontSize=baseFontSize/scale;chars=Math.floor(maxChars*scale);lines=wrap(chars);}
  if(lines.length>maxLines){lines=lines.slice(0,maxLines);const last=lines[maxLines-1];if(last&&last.length>3)lines[maxLines-1]=last.slice(0,-2)+'...';}
